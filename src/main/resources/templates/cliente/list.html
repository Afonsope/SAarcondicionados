<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Clientes</title>
    <link rel="stylesheet" href="/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <div class="container">
        <h1 class="mt-4">Lista de Clientes</h1>
        <a href="/cliente/form" class="btn btn-primary mb-3">Adicionar Cliente</a>
        <table class="table table-striped">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nome</th>
                    <th>CPF</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody>
                <!-- Aqui você deve iterar sobre a lista de clientes -->
                <tr th:each="cliente : ${clientes}">
                    <td th:text="${cliente.id_pessoa}"></td>
                    <td th:text="${cliente.nome}"></td>
                    <td th:text="${cliente.cpf}"></td>
                    <td>
                        <a th:href="@{/cliente/detail(id=${cliente.id_pessoa})}" class="btn btn-info">Detalhes</a>
                        <a th:href="@{/cliente/form(id=${cliente.id_pessoa})}" class="btn btn-warning">Editar</a>
                        <a th:href="@{/cliente/delete(id=${cliente.id_pessoa})}" class="btn btn-danger" onclick="return confirm('Tem certeza que deseja excluir?');">Excluir</a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
    <script src="/js/app.js"></script>
</body>
</html>
