<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Usuários</title>
    <link rel="stylesheet" href="/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <div class="container">
        <h1 class="mt-4">Lista de Usuários</h1>
        <a href="/usuario/form" class="btn btn-primary mb-3">Adicionar Usuário</a>
        <table class="table table-striped">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nome</th>
                    <th>Login</th>
                    <th>Status</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody>
                <!-- Aqui você pode iterar sobre a lista de usuários -->
                <tr th:each="usuario : ${usuarios}">
                    <td th:text="${usuario.id_usuario}"></td>
                    <td th:text="${usuario.nome}"></td>
                    <td th:text="${usuario.login}"></td>
                    <td th:text="${usuario.ativo ? 'Ativo' : 'Inativo'}"></td>
                    <td>
                        <a th:href="@{/usuario/form(id=${usuario.id_usuario})}" class="btn btn-warning">Editar</a>
                        <a th:href="@{/usuario/delete(id=${usuario.id_usuario})}" class="btn btn-danger">Excluir</a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
    <script src="/js/app.js"></script>
</body>
</html>
