<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de Orçamento</title>
    <link rel="stylesheet" href="/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <div class="container">
        <h1>Formulário de Orçamento</h1>
        <form action="/orcamento/save" method="post">
            <div class="form-group">
                <label for="id_cliente">Cliente</label>
                <select id="id_cliente" name="id_cliente" class="form-control" required>
                    <!-- Options will be populated dynamically -->
                </select>
            </div>
            <div class="form-group">
                <label for="id_funcionario">Funcionário Responsável</label>
                <select id="id_funcionario" name="id_funcionario" class="form-control" required>
                    <!-- Options will be populated dynamically -->
                </select>
            </div>
            <div class="form-group">
                <label for="data_validade">Data de Validade</label>
                <input type="date" id="data_validade" name="data_validade" class="form-control" required>
            </div>
            <div class="form-group">
                <label for="status">Status</label>
                <select id="status" name="status" class="form-control">
                    <option value="pendente">Pendente</option>
                    <option value="aprovado">Aprovado</option>
                    <option value="reprovado">Reprovado</option>
                    <option value="expirado">Expirado</option>
                </select>
            </div>
            <div class="form-group">
                <label for="valor_total">Valor Total</label>
                <input type="number" id="valor_total" name="valor_total" class="form-control" step="0.01" required>
            </div>
            <button type="submit" class="btn btn-primary">Salvar</button>
            <a href="/orcamento/list" class="btn btn-secondary">Cancelar</a>
        </form>
    </div>
    <script src="/js/app.js"></script>
</body>
</html>
