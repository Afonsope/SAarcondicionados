<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de Cliente</title>
    <link rel="stylesheet" href="/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <div class="container">
        <h1>Formulário de Cliente</h1>
        <form action="/clientes" method="POST">
            <div class="form-group">
                <label for="nome">Nome:</label>
                <input type="text" class="form-control" id="nome" name="nome" required>
            </div>
            <div class="form-group">
                <label for="cpf">CPF:</label>
                <input type="text" class="form-control" id="cpf" name="cpf" required>
            </div>
            <div class="form-group">
                <label for="tipo_cliente">Tipo de Cliente:</label>
                <select class="form-control" id="tipo_cliente" name="tipo_cliente" required>
                    <option value="residencial">Residencial</option>
                    <option value="comercial">Comercial</option>
                </select>
            </div>
            <div class="form-group">
                <label for="cnpj">CNPJ (se aplicável):</label>
                <input type="text" class="form-control" id="cnpj" name="cnpj">
            </div>
            <div class="form-group">
                <label for="data_cadastro">Data de Cadastro:</label>
                <input type="date" class="form-control" id="data_cadastro" name="data_cadastro" value="{{ currentDate }}" required>
            </div>
            <button type="submit" class="btn btn-primary">Salvar</button>
            <a href="/clientes" class="btn btn-secondary">Cancelar</a>
        </form>
    </div>
    <script src="/js/app.js"></script>
</body>
</html>
