<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Funcionários</title>
    <link rel="stylesheet" href="/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <div class="container">
        <h1 class="mt-4">Lista de Funcionários</h1>
        <a href="/funcionario/form" class="btn btn-primary mb-3">Adicionar Funcionário</a>
        <table class="table table-striped">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nome</th>
                    <th>CPF</th>
                    <th>Cargo</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody>
                <!-- Loop through the list of funcionarios -->
                <tr th:each="funcionario : ${funcionarios}">
                    <td th:text="${funcionario.id_pessoa}"></td>
                    <td th:text="${funcionario.nome}"></td>
                    <td th:text="${funcionario.cpf}"></td>
                    <td th:text="${funcionario.cargo}"></td>
                    <td>
                        <a th:href="@{/funcionario/form(id=${funcionario.id_pessoa})}" class="btn btn-warning">Editar</a>
                        <a th:href="@{/funcionario/delete(id=${funcionario.id_pessoa})}" class="btn btn-danger" onclick="return confirm('Tem certeza que deseja excluir?');">Excluir</a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
    <script src="/js/app.js"></script>
</body>
</html>
