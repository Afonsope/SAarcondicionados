<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de Funcionário</title>
    <link rel="stylesheet" href="/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <div class="container">
        <h1>Formulário de Funcionário</h1>
        <form action="/funcionario/save" method="POST">
            <div class="form-group">
                <label for="nome">Nome:</label>
                <input type="text" class="form-control" id="nome" name="nome" required>
            </div>
            <div class="form-group">
                <label for="cpf">CPF:</label>
                <input type="text" class="form-control" id="cpf" name="cpf" required>
            </div>
            <div class="form-group">
                <label for="matricula">Matrícula:</label>
                <input type="text" class="form-control" id="matricula" name="matricula" required>
            </div>
            <div class="form-group">
                <label for="cargo">Cargo:</label>
                <input type="text" class="form-control" id="cargo" name="cargo" required>
            </div>
            <div class="form-group">
                <label for="setor">Setor:</label>
                <input type="text" class="form-control" id="setor" name="setor" required>
            </div>
            <div class="form-group">
                <label for="data_admissao">Data de Admissão:</label>
                <input type="date" class="form-control" id="data_admissao" name="data_admissao" required>
            </div>
            <div class="form-group">
                <label for="salario">Salário:</label>
                <input type="number" class="form-control" id="salario" name="salario" step="0.01" required>
            </div>
            <button type="submit" class="btn btn-primary">Salvar</button>
            <a href="/funcionario/list" class="btn btn-secondary">Cancelar</a>
        </form>
    </div>
    <script src="/js/app.js"></script>
</body>
</html>
