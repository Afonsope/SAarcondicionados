<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de Ordem de Serviço</title>
    <link rel="stylesheet" href="/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <div class="container">
        <h1>Formulário de Ordem de Serviço</h1>
        <form action="/os/save" method="post">
            <div class="form-group">
                <label for="id_cliente">Cliente</label>
                <select id="id_cliente" name="id_cliente" class="form-control" required>
                    <!-- Options for clients will be populated here -->
                </select>
            </div>
            <div class="form-group">
                <label for="id_funcionario">Funcionário Responsável</label>
                <select id="id_funcionario" name="id_funcionario" class="form-control" required>
                    <!-- Options for employees will be populated here -->
                </select>
            </div>
            <div class="form-group">
                <label for="id_tipo_os">Tipo de Ordem de Serviço</label>
                <select id="id_tipo_os" name="id_tipo_os" class="form-control" required>
                    <!-- Options for service order types will be populated here -->
                </select>
            </div>
            <div class="form-group">
                <label for="descricao_problema">Descrição do Problema</label>
                <textarea id="descricao_problema" name="descricao_problema" class="form-control" rows="4" required></textarea>
            </div>
            <div class="form-group">
                <label for="observacoes">Observações</label>
                <textarea id="observacoes" name="observacoes" class="form-control" rows="4"></textarea>
            </div>
            <button type="submit" class="btn btn-primary">Salvar</button>
            <a href="/os" class="btn btn-secondary">Cancelar</a>
        </form>
    </div>
    <script src="/js/app.js"></script>
</body>
</html>
